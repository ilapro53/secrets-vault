<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🔐 Secrets Vault — Command OTP</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, system-ui, sans-serif;
  background: #0f0f1a; color: #e0e0e0;
  min-height: 100vh; display: flex; justify-content: center; align-items: center;
  padding: 16px;
}
.card {
  background: #1a1a2e; border-radius: 16px; padding: 28px 24px;
  width: 100%; max-width: 400px; box-shadow: 0 8px 32px rgba(0,0,0,.4);
}
h1 { font-size: 20px; margin-bottom: 12px; text-align: center; color: #7c5cfc; }
.subtitle { font-size: 12px; color: #555; text-align: center; margin-bottom: 16px; }
label { display: block; font-size: 13px; color: #999; margin-bottom: 4px; margin-top: 14px; }
input, textarea {
  width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #333;
  background: #16162a; color: #fff; font-size: 15px; font-family: monospace;
}
input:focus, textarea:focus { outline: none; border-color: #7c5cfc; }
textarea { resize: vertical; min-height: 44px; }
.btn {
  width: 100%; padding: 12px; margin-top: 18px; border-radius: 10px;
  border: none; font-size: 15px; font-weight: 600; cursor: pointer;
  background: #7c5cfc; color: #fff; transition: background .15s;
}
.btn:active { background: #5f3ee0; }
.btn-secondary {
  background: #2a2a44; color: #999; margin-top: 6px; font-size: 12px; display: none;
}
.code-display {
  margin-top: 20px; padding: 20px; border-radius: 12px;
  background: #0d0d1a; text-align: center; display: none;
}
.code-display .code { font-size: 48px; font-weight: 700; letter-spacing: 4px; color: #7c5cfc; }
.code-display .remaining { font-size: 12px; color: #666; margin-top: 6px; }
.code-display .verified-info { font-size: 12px; color: #4caf50; margin-top: 4px; display: none; }
.code-display .hint { font-size: 11px; color: #555; margin-top: 10px; }
.error { color: #f44336; font-size: 13px; margin-top: 6px; display: none; }
.setup-hint { font-size: 11px; color: #555; margin-top: 16px; text-align: center; }
</style>
</head>
<body>
<div class="card">
  <h1>🔐 Secrets Vault</h1>
  <div class="subtitle">Command-bound OTP · код действует 10 минут</div>

  <label for="secretInput">Secret key (из QR/setup)</label>
  <input type="password" id="secretInput" placeholder="Вставьте secret key...">

  <label for="cmdInput">Команда (от агента)</label>
  <textarea id="cmdInput" placeholder="Например: ssh/deploy" rows="2"></textarea>

  <button class="btn" onclick="generateCode()">🔑 Сгенерировать код</button>

  <div class="error" id="error"></div>

  <div class="code-display" id="codeDisplay">
    <div class="code" id="codeValue">------</div>
    <div class="remaining" id="remaining">—</div>
    <div class="verified-info" id="verifiedInfo">✅ Код привязан к этой команде</div>
    <div class="hint" id="windowHint">Действителен ещё 10 минут</div>
    <button class="btn btn-secondary" id="clearBtn" onclick="clearSecret()">Очистить секрет</button>
  </div>

  <div class="setup-hint">
    При первом использовании — получи secret key через<br>
    <code>sudo secrets-uri</code> на сервере и вставь выше.
  </div>
</div>

<script>
// Decode base32 (RFC 4648)
function base32ToBytes(b32) {
  const map = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
  b32 = b32.replace(/[^A-Za-z2-7]/g, '').toUpperCase();
  const bits = [];
  for (const ch of b32) {
    const val = map.indexOf(ch);
    if (val < 0) continue;
    for (let i = 4; i >= 0; i--) bits.push((val >> i) & 1);
  }
  const bytes = [];
  for (let i = 0; i + 7 < bits.length; i += 8) {
    let byte = 0;
    for (let j = 0; j < 8; j++) byte = (byte << 1) | bits[i + j];
    bytes.push(byte);
  }
  return new Uint8Array(bytes);
}

function toHex(bytes) {
  return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function generateCode() {
  const $ = id => document.getElementById(id);
  const error = $('error');
  const codeDisplay = $('codeDisplay');

  error.style.display = 'none';

  let secret = $('secretInput').value.trim();
  const cmd = $('cmdInput').value.trim();

  if (!secret) { error.textContent = 'Вставьте secret key'; error.style.display = 'block'; return; }
  if (!cmd) { error.textContent = 'Введите команду'; error.style.display = 'block'; return; }

  try { localStorage.setItem('sv_secret', secret); } catch(e) {}

  const now = Math.floor(Date.now() / 1000);
  // 10-minute window (600 seconds)
  const timeWindow = Math.floor(now / 600);
  const windowRemaining = 600 - (now % 600);
  const minutes = Math.floor(windowRemaining / 60);
  const seconds = windowRemaining % 60;

  const msg = cmd + '|' + timeWindow;
  const enc = new TextEncoder();

  try {
    const keyBytes = base32ToBytes(secret);
    const msgBytes = enc.encode(msg);
    const key = await crypto.subtle.importKey('raw', keyBytes, { name: 'HMAC', hash: 'SHA-1' }, false, ['sign']);
    const sig = await crypto.subtle.sign('HMAC', key, msgBytes);
    const hmac = toHex(new Uint8Array(sig));

    // Dynamic truncation (RFC 4226)
    const offset = parseInt(hmac.slice(-1), 16) * 2;
    const partial = parseInt(hmac.substr(offset, 8), 16);
    const otp = (partial & 0x7fffffff) % 1000000;

    $('codeValue').textContent = String(otp).padStart(6, '0');
    $('remaining').textContent = 'Для команды: ' + cmd;
    $('windowHint').textContent = 'Действителен ещё ' + minutes + 'м ' + seconds + 'с (окно 10 мин)';
    $('verifiedInfo').style.display = 'block';
    $('clearBtn').style.display = 'block';
    codeDisplay.style.display = 'block';
  } catch(e) {
    error.textContent = 'Ошибка: ' + e.message;
    error.style.display = 'block';
  }
}

function clearSecret() {
  document.getElementById('secretInput').value = '';
  document.getElementById('codeDisplay').style.display = 'none';
  document.getElementById('clearBtn').style.display = 'none';
  try { localStorage.removeItem('sv_secret'); } catch(e) {}
}

// Restore saved secret
try { const s = localStorage.getItem('sv_secret'); if (s) document.getElementById('secretInput').value = s; } catch(e) {}

// Auto-update timer display every 10s (code stays same for 10 min)
setInterval(() => {
  if (document.getElementById('codeDisplay').style.display === 'block') {
    const now = Math.floor(Date.now() / 1000);
    const windowRemaining = 600 - (now % 600);
    const m = Math.floor(windowRemaining / 60);
    const s = windowRemaining % 60;
    document.getElementById('windowHint').textContent = 'Действителен ещё ' + m + 'м ' + s + 'с (окно 10 мин)';
  }
}, 10000);
</script>
</body>
</html>
